<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFF8EC">
<title>Ferramenta Certa</title>
<meta name="description" content="Jogo educativo para crianças: na oficina do castor Chico, ligue cada ferramenta ao que ela faz. Memória, Qual ferramenta?, Entrada ou saída? e Antes e depois. O computador também é uma caixa de ferramentas.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fontes/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fontes/nunito-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="fundo" aria-hidden="true"></div>

<header class="barra">
  <button class="marca" id="btInicio" aria-label="Ir para a caixa de ferramentas"><span class="chico-mini" aria-hidden="true"></span><span><b>Ferramenta Certa</b><small>A oficina do Chico</small></span></button>
  <button class="bt-barra" id="btMapa"><span>Oficina</span></button>
  <button class="bt-barra" id="btAjustes" aria-label="Ajustes"><span>Ajustes</span></button>
</header>

<main>
  <section class="tela" id="mapa"></section>

  <section class="tela oculto" id="jogo">
    <div class="jogo-topo">
      <button class="bt-voltar" id="btVoltar">Oficina</button>
      <div class="chip" id="chipGaveta"></div>
      <div class="previa" id="previa" aria-hidden="true"></div>
      <button class="bt-redondo" id="btOuvir" aria-label="Ouvir a instrução"></button>
    </div>
    <div class="palco" id="palco"></div>
    <div class="aviso" id="aviso" aria-live="polite"></div>
  </section>

  <section class="tela oculto" id="ajustes"></section>
</main>

<div class="veu oculto" id="janela" role="dialog" aria-modal="true"></div>
<div class="veu oculto" id="premio" role="dialog" aria-modal="true"></div>

<script src="icones.js"></script>
<script src="jogo.js"></script>
</body>
</html>
